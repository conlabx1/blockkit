[project]
name = "blockkit"
version = "0.1.0"
description = "블록 조립식 프로젝트 틀"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.4"]

# 아래는 점검(./check)의 예외를 적는 유일한 자리다. 여기에 더하면 점검이 느슨해지므로, 더한 내용과 이유를 보고에 적는다.
# 패턴 검사의 규칙은 check 안에 고정돼 있다. 이 파일의 [tool.ruff] 나 ruff.toml 은 점검에 쓰이지 않는다.

[tool.blockkit]
# 블록과 조립 파일(app.py)이 추가로 불러 써도 되는 모듈. 통로(doors)는 제한이 없다.
extra-imports = []

[tool.blockkit.pattern-exceptions]
# "파일" = ["끌 규칙", ...]
# check 와 그 시험은 고정된 인자로 uv 와 python 을 실행한다.
"check" = ["S603"]
"tests/test_check.py" = ["S603"]
