[package]
name = "check"
version = "0.1.0"
edition = "2024"
publish = false

# 점검 명령은 프로젝트의 워크스페이스에 넣지 않고 따로 둔다.
# 프로젝트의 Cargo.toml 과 Cargo.lock 이 바뀌어도 점검 명령의 부품과 빌드 설정은 그대로다.
[workspace]

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
